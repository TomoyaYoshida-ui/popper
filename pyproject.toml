[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "popper-research"
version = "0.1.0"
description = "Local-first evidence-backed experiment runner"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.12,<3"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
adaptive = ["numpy==2.2.6", "scikit-learn==1.7.2", "pandas==2.3.3", "openpyxl>=3.1,<4", "xlrd==2.0.1", "pydantic-ai-slim[openai]>=2.54.0,<2.55", "httpx2>=2.14,<3"]
analysis = ["numpy==2.2.6"]
ml = ["scikit-learn>=1.7,<1.8"]
intake = ["pyarrow>=18,<25"]
research = ["requests>=2.31,<3", "pypdf>=5,<7"]
orchestration = ["langgraph>=0.2", "langgraph-checkpoint-sqlite>=2"]
agent = ["pydantic-ai-slim[openai]>=2.54.0,<2.55", "httpx2>=2.14,<3"]
confirmation = ["cryptography>=48,<49"]
workstation = ["pywinpty>=3,<4; platform_system == 'Windows'"]
figs = ["numpy==2.2.6", "scikit-learn==1.7.2", "pandas==2.3.3",
        "imodels @ git+https://github.com/csinva/imodels.git@e8efb7e7b599e4d0f3e3399174e6684d125acb6f"]

[project.scripts]
popper = "popper.cli:main"

[tool.setuptools.packages.find]
include = ["popper*"]

[tool.setuptools.package-data]
popper = ["web/index.html", "web/assets/*", "demo_templates/*/*"]
