name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest / windows / py${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python >= 3.10（pyproject.toml）
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装（核心零运行时依赖）
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .
      - name: 全量测试
        # 含 tests/test_doc_consistency.py：文档口径与实现的漂移门禁
        # 输出落盘后再原样 cat，并用 $status 显式退出——不用管道，消除「退出码被管道洗白」这类风险。
        # -rs：把 skip 名单（带原因）写进输出，否则「job 绿」与「关键用例全被 skip」在外部一样。
        # PYTHONIOENCODING：跳过原因与断言消息都是中文，重定向到文件时默认按宿主 locale 编码，
        # 不钉 UTF-8 则递出来的名单是一堆问号。
        id: pytest
        env:
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          status=0
          # GitHub 的 bash 带 -e：写成 `cmd` + 下一行 `status=$?` 时，非零退出直接终止
          # 本步骤（红绿仍对，但后面的 cat 与落盘都不会执行）。|| 取回状态才拿得到它。
          python -m pytest -q -rfEs --tb=short > pytest-output.txt 2>&1 || status=$?
          echo "$status" > pytest-status.txt
          cat pytest-output.txt
          exit $status
      - name: 失败清单与 skip 名单写进 job summary
        # Actions 日志页需登录才能看，run 页面的 job summary 对公开仓库免登录可读：
        # 红的时候让 CI 自己把 FAILED/ERROR 清单递出来，而不是剩个 exit code 1 给人猜。
        # always()（不是 failure()）：绿跑也要递 skip 名单——带原因的 skip 在外部与「真跑了」
        # 不可区分，只报失败等于仪表在自己最该看的分支上沉默。脚本靠 TEST_STEP_OUTCOME
        # 分辨绿/红分支，绿时只发 notice、不误发 error。
        if: always()
        env:
          TEST_STEP_OUTCOME: ${{ steps.pytest.outcome }}
        run: python -X utf8 .github/scripts/ci_failure_summary.py pytest-output.txt

  test-optional-extras:
    name: pytest / windows / 可选 extras
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装（含全部四个 extras）
        # 四个 extra 必须装齐：pyproject 声明的每个 extra 都要有 job 真装真跑，
        # 否则对应用例在 CI 上等于不存在（曾漏装 orchestration，langgraph 分支全没跑过）。
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ".[ml,research,orchestration,confirmation]"
      - name: 全量测试（覆盖需要可选依赖的分支）
        # -rs 与 PYTHONIOENCODING 的理由同 test job：skip 名单要能递出来、递出来要读得懂。
        id: pytest
        env:
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          status=0
          # GitHub 的 bash 带 -e：写成 `cmd` + 下一行 `status=$?` 时，非零退出直接终止
          # 本步骤（红绿仍对，但后面的 cat 与落盘都不会执行）。|| 取回状态才拿得到它。
          python -m pytest -q -rfEs --tb=short > pytest-output.txt 2>&1 || status=$?
          echo "$status" > pytest-status.txt
          cat pytest-output.txt
          exit $status
      - name: 失败清单与 skip 名单写进 job summary
        # 绿跑也递 skip 名单：extras 少装一个就会表现成「一大片带原因的 skip」，
        # 只看失败清单的仪表会把这种空转读成「该 job 什么都没发生」。
        if: always()
        env:
          TEST_STEP_OUTCOME: ${{ steps.pytest.outcome }}
        run: python -X utf8 .github/scripts/ci_failure_summary.py pytest-output.txt

  linux:
    name: pytest / ubuntu / bubblewrap 沙箱后端
    runs-on: ubuntu-latest
    # 沙箱后端注册表（popper/sandbox/__init__.py）已登记 win_lowil 与 linux_bwrap，
    # Linux 上 selected_backend() 在探活通过时返回 linux_bwrap。本 job 是 Linux 隔离路径在
    # **单测层**的真实执行验证点（生命周期级的端到端另有 linux-sandbox-e2e job），所以三件事缺一不可：
    #   1. 显式安装 bubblewrap，不依赖 runner 镜像「恰好带」（与第 2 条都在
    #      `.github/actions/sandbox-env`，两个 ubuntu job 共用）；
    #   2. 给 /usr/bin/bwrap 开 AppArmor 的 userns 例外——Ubuntu 23.10+/24.04+ 默认拒绝
    #      非特权用户命名空间，此时 bwrap 装了也建不了沙箱，而 `bwrap --version` 依然返回 0；
    #   3. POPPER_REQUIRE_SANDBOX=1 让「后端不可用」从静默 skip 变成红：否则硬门禁绿得
    #      毫无意义（沙箱用例全跳过，等于没测）。
    # 本地 Linux 未安装/不可用 bwrap 时不设该变量：available() 返回 False，--sandbox
    # 显式报错并给出修复指引，测试跳过。
    env:
      POPPER_REQUIRE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装（Linux job 装齐四个 extra）
        # 与 test job 相反：这里不是零依赖验证点，而是沙箱硬门禁。真实沙箱 worker
        # 用例同时要求沙箱后端与 cryptography（见 test_research_confirmation_runner.py 的
        # 类级守卫），少装任何一个 extra 都会让 POPPER_REQUIRE_SANDBOX=1 的硬门禁在
        # 「对应用例被 skip」的情况下发绿——那正是本 job 存在的理由被空转。
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ".[ml,research,orchestration,confirmation]"
      - name: 准备 bubblewrap 沙箱环境
        # 装 bwrap / 开 AppArmor 的 userns 例外 / 按真实形状探活——三步都在
        # `.github/actions/sandbox-env`，与下面的端到端 job 共用一个出处（为什么必须共用、
        # 为什么它们全是 continue-on-error，见那个 action.yml 的 description）。
        uses: ./.github/actions/sandbox-env
      - name: 安装中文字体（PDF 渲染用例需要）
        # ubuntu runner 镜像不带中文字体，`popper.pdfgen.discover_font()` 找不到字体时
        # 渲染显式报 ProtocolError——这是产品的 fail-closed，不是测试的锅。
        # 刻意装 WQY（TrueType 轮廓）而不是 fonts-noto-cjk：后者 .ttc 里是 CFF 轮廓，
        # 而我们的子集化器按字节读 glyf/loca，只支持 TrueType（discover_font 已钉住这点）。
        # continue-on-error：诊断/装环境的一步不能当门禁。run 35300378254 里这一步红以
        # 后 GitHub 直接 skip 了后面的全量测试，Linux 侧一整轮的修复信号就这么被遮掉了；
        # 真正的门禁是 test_manuscript_pdf_is_valid_single_embedded_font，它一定会红。
        continue-on-error: true
        run: |
          sudo apt-get install -y fonts-wqy-microhei fonts-wqy-zenhei \
            || echo "::warning::apt 装不上 wqy 字体，后面的 PDF 用例会真红"
      - name: 自证中文字体可被 popper 探测（只报告，不充当门禁）
        # 把「没装字体」与「装了但 popper 探测不认」分开：前者看上一行，后者由这个脚本
        # 逐个打印候选字体的轮廓类型与 cmap 命中情况（Actions 日志要登录，所以关键结论
        # 同时打成 annotation）。
        continue-on-error: true
        run: python -X utf8 .github/scripts/check_cjk_font.py
      - name: 全量测试（POPPER_REQUIRE_SANDBOX=1：沙箱用例不许静默 skip）
        # 含 tests/test_doc_consistency.py：文档口径与实现的漂移门禁
        # -rs 在本 job 尤其重要：硬门禁只能保证「该跑的不跑就红」，保证不了「没红的
        # 那些到底跑了还是被 skip」，后者只能靠 skip 名单递出来。
        id: pytest
        env:
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          status=0
          # GitHub 的 bash 带 -e：写成 `cmd` + 下一行 `status=$?` 时，非零退出直接终止
          # 本步骤（红绿仍对，但后面的 cat 与落盘都不会执行）。|| 取回状态才拿得到它。
          python -m pytest -q -rfEs --tb=short > pytest-output.txt 2>&1 || status=$?
          echo "$status" > pytest-status.txt
          cat pytest-output.txt
          exit $status
      - name: 失败清单与 skip 名单写进 job summary
        # 本 job 在测试步骤之前还有 apt/ bubblewrap / 沙箱探活三道门槛，哪一步红都会
        # 在这里写明「没拿到 pytest 输出」，避免被误读成「测试挂了」。
        # always()：绿跑时要递出沙箱/字体相关用例的 skip 名单（否则无法从免登录侧
        # 区分「真跑了」与「带原因 skip」）。
        if: always()
        env:
          TEST_STEP_OUTCOME: ${{ steps.pytest.outcome }}
        run: python -X utf8 .github/scripts/ci_failure_summary.py pytest-output.txt

  linux-sandbox-e2e:
    name: e2e / ubuntu / --sandbox 完整实验（C7 验证项 3）
    runs-on: ubuntu-latest
    # 上面那个 ubuntu job 只跑单测：它能证明「某个断言在 bwrap 下成立」，证明不了从
    # init → search --sandbox → freeze → confirm --sandbox → report/replay 的**整条生命周期**
    # 里候选进程始终在被约束的状态下执行——而 README/技术方案 M2 承诺的正是后者。
    # 这条 job 就是把那条主张跑一遍并把证据递出来（取证逻辑、以及为何不能只看
    # 「跑完了不报错」，全写在 .github/scripts/e2e_sandbox_experiment.py 的文档字符串里）。
    # 为什么单独一个 job 而不是在上面那 job 里加一步：GitHub 的 annotation 预算是**每个
    # check run 最近 10 条**，两套仪表挤在同一个 job 里会互相顶掉（skip 名单顶掉端到端结论，
    # 或反之）。拆开后各有 10 条，且并行跑、不多花墙钟时间。
    # 不设 POPPER_REQUIRE_SANDBOX：那是单测侧防止静默 skip 的闸门；本 job 的闸门是脚本
    # 自己在没有可用后端时直接红（没有后端的端到端就是假端到端，见脚本 main）。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装（只装 -e .，不装任何 extra）
        # 端到端走的是核心 CLI，它只依赖标准库——这同时是「零运行时依赖」那条对外主张在
        # **真实执行路径**上的验证点（零依赖单测 job 只证到测试层，没证到能跑完一个实验）。
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: 准备 bubblewrap 沙箱环境
        # 与单测 job 同一个出处：装 bwrap + 开 AppArmor userns 例外 + 真实形状探活。
        uses: ./.github/actions/sandbox-env
      - name: 跑一整个 --sandbox 端到端实验并取证
        # 退出码单独落盘、不用管道取退码（理由同全量测试那一步：GitHub 的 bash 带 -e）。
        # `--expect-backend` 是必须的：不钉住后端，「静默换成了另一个机制」也能绿。
        # stdout 直接重定向给文件，不经 PowerShell（本地取证已踩过二次解码的乱码坑）。
        id: e2e
        shell: bash
        run: |
          status=0
          python -X utf8 .github/scripts/e2e_sandbox_experiment.py \
            --expect-backend linux_bubblewrap > e2e-output.txt 2>&1 || status=$?
          echo "$status" > e2e-status.txt
          cat e2e-output.txt
          exit $status
      - name: 端到端仪表不得沉默
        # 与 pytest 那侧同一个教训：脚本在能递出结论**之前**就挂掉时（import 失败、被 SIGKILL、
        # runner 抽风），一条 annotation 也不会有，免登录侧只剩「exit code 1」让人猜。
        # 本步自己永不红（它是诊断不是门禁；真红已由上一步递过）。
        if: always()
        shell: bash
        run: |
          status=$(cat e2e-status.txt 2>/dev/null || echo '?')
          if grep -q '\[e2e-sandbox\]' e2e-output.txt 2>/dev/null; then
            echo "端到端脚本自己已递出结论（退出码 $status），本步不多报"
            exit 0
          fi
          tail=$(tail -c 400 e2e-output.txt 2>/dev/null | tr '\n' ' ')
          bytes=$(wc -c < e2e-output.txt 2>/dev/null || echo 0)
          echo "::error::[e2e-sandbox] exited $status with no self-report; output bytes=$bytes; tail: ${tail:-empty}"
