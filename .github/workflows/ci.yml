name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest / windows / py${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python >= 3.10（pyproject.toml）
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装（核心零运行时依赖）
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .
      - name: 全量测试
        # 含 tests/test_doc_consistency.py：文档口径与实现的漂移门禁
        # 输出落盘后再原样 cat，并用 $status 显式退出——不用管道，消除「退出码被管道洗白」这类风险。
        shell: bash
        run: |
          status=0
          # GitHub 的 bash 带 -e：写成 `cmd` + 下一行 `status=$?` 时，非零退出直接终止
          # 本步骤（红绿仍对，但后面的 cat 与落盘都不会执行）。|| 取回状态才拿得到它。
          python -m pytest -q -rfE --tb=short > pytest-output.txt 2>&1 || status=$?
          echo "$status" > pytest-status.txt
          cat pytest-output.txt
          exit $status
      - name: 失败清单写进 job summary
        # Actions 日志页需登录才能看，run 页面的 job summary 对公开仓库免登录可读：
        # 红的时候让 CI 自己把 FAILED/ERROR 清单递出来，而不是剩个 exit code 1 给人猜。
        if: failure()
        run: python -X utf8 .github/scripts/ci_failure_summary.py pytest-output.txt

  test-optional-extras:
    name: pytest / windows / 可选 extras
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装（含全部四个 extras）
        # 四个 extra 必须装齐：pyproject 声明的每个 extra 都要有 job 真装真跑，
        # 否则对应用例在 CI 上等于不存在（曾漏装 orchestration，langgraph 分支全没跑过）。
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ".[ml,research,orchestration,confirmation]"
      - name: 全量测试（覆盖需要可选依赖的分支）
        shell: bash
        run: |
          status=0
          # GitHub 的 bash 带 -e：写成 `cmd` + 下一行 `status=$?` 时，非零退出直接终止
          # 本步骤（红绿仍对，但后面的 cat 与落盘都不会执行）。|| 取回状态才拿得到它。
          python -m pytest -q -rfE --tb=short > pytest-output.txt 2>&1 || status=$?
          echo "$status" > pytest-status.txt
          cat pytest-output.txt
          exit $status
      - name: 失败清单写进 job summary
        if: failure()
        run: python -X utf8 .github/scripts/ci_failure_summary.py pytest-output.txt

  linux:
    name: pytest / ubuntu / bubblewrap 沙箱后端
    runs-on: ubuntu-latest
    # 沙箱后端注册表（popper/sandbox/__init__.py）已登记 win_lowil 与 linux_bwrap，
    # Linux 上 selected_backend() 在探活通过时返回 linux_bwrap。本 job 是 Linux 隔离路径
    # 唯一的真实执行验证点，所以三件事缺一不可：
    #   1. 显式安装 bubblewrap，不依赖 runner 镜像「恰好带」；
    #   2. 给 /usr/bin/bwrap 开 AppArmor 的 userns 例外——Ubuntu 23.10+/24.04+ 默认拒绝
    #      非特权用户命名空间，此时 bwrap 装了也建不了沙箱，而 `bwrap --version` 依然返回 0；
    #   3. POPPER_REQUIRE_SANDBOX=1 让「后端不可用」从静默 skip 变成红：否则硬门禁绿得
    #      毫无意义（沙箱用例全跳过，等于没测）。
    # 本地 Linux 未安装/不可用 bwrap 时不设该变量：available() 返回 False，--sandbox
    # 显式报错并给出修复指引，测试跳过。
    env:
      POPPER_REQUIRE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装（Linux job 装齐四个 extra）
        # 与 test job 相反：这里不是零依赖验证点，而是沙箱硬门禁。真实沙箱 worker
        # 用例同时要求沙箱后端与 cryptography（见 test_research_confirmation_runner.py 的
        # 类级守卫），少装任何一个 extra 都会让 POPPER_REQUIRE_SANDBOX=1 的硬门禁在
        # 「对应用例被 skip」的情况下发绿——那正是本 job 存在的理由被空转。
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ".[ml,research,orchestration,confirmation]"
      - name: 安装 bubblewrap
        # 环境准备步骤不当门禁：装不上就会由需要沙箱的用例在测试里真红（见下面的
        # POPPER_REQUIRE_SANDBOX），但测试本身仍会跑完，信号不被遮。
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
      - name: 安装中文字体（PDF 渲染用例需要）
        # ubuntu runner 镜像不带中文字体，`popper.pdfgen.discover_font()` 找不到字体时
        # 渲染显式报 ProtocolError——这是产品的 fail-closed，不是测试的锅。
        # 刻意装 WQY（TrueType 轮廓）而不是 fonts-noto-cjk：后者 .ttc 里是 CFF 轮廓，
        # 而我们的子集化器按字节读 glyf/loca，只支持 TrueType（discover_font 已钉住这点）。
        # continue-on-error：诊断/装环境的一步不能当门禁。run 35300378254 里这一步红以
        # 后 GitHub 直接 skip 了后面的全量测试，Linux 侧一整轮的修复信号就这么被遮掉了；
        # 真正的门禁是 test_manuscript_pdf_is_valid_single_embedded_font，它一定会红。
        continue-on-error: true
        run: |
          sudo apt-get install -y fonts-wqy-microhei fonts-wqy-zenhei \
            || echo "::warning::apt 装不上 wqy 字体，后面的 PDF 用例会真红"
      - name: 自证中文字体可被 popper 探测（只报告，不充当门禁）
        # 把「没装字体」与「装了但 popper 探测不认」分开：前者看上一行，后者由这个脚本
        # 逐个打印候选字体的轮廓类型与 cmap 命中情况（Actions 日志要登录，所以关键结论
        # 同时打成 annotation）。
        continue-on-error: true
        run: python -X utf8 .github/scripts/check_cjk_font.py
      - name: 允许 bwrap 使用非特权用户命名空间
        # 只在系统真的有该限制时动策略；用 profile 级 userns 例外而不是全局
        # sysctl=0，免得把 runner 上其它主体的 userns 限制一并关掉。
        # 失败不阻断测试：命名空间真不可用时，由下面的探活与 POPPER_REQUIRE_SANDBOX
        # 在用例层报红，而不是把整个测试步骤 skip 掉。
        continue-on-error: true
        run: |
          set -uo pipefail
          key=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ ! -e "$key" ]; then echo "无 apparmor userns 限制，跳过"; exit 0; fi
          echo "限制当前值：$(cat $key)"
          if [ "$(cat $key)" = "0" ]; then exit 0; fi
          if ! command -v apparmor_parser >/dev/null 2>&1; then
            echo "apparmor_parser 不可用，退回全局 sysctl"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            exit 0
          fi
          printf '#include <tunables/global>\n\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n\n  include if exists <local/bwrap>\n}\n' | sudo tee /etc/apparmor.d/bwrap >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
      - name: 沙箱探活（真建一次命名空间，不看版本号）
        # 只报告原因，不充当门禁：命名空间不可用时，需要沙箱的用例会在 POPPER_REQUIRE_SANDBOX=1
        # 下自己红——那才是带完整失败清单的信号（这一步一硬，后面的全量测试会被整步 skip）。
        continue-on-error: true
        run: |
          python -c "from popper import sandbox; from popper.sandbox import linux_bwrap; ok = linux_bwrap.available(); print('linux_bwrap available:', ok); print('probe detail:', linux_bwrap.probe_detail() or '-'); print('selected backend:', sandbox.selected_backend_name()); print('hint:', linux_bwrap.APPARMOR_HINT); raise SystemExit(0 if ok else 1)"
      - name: 全量测试（POPPER_REQUIRE_SANDBOX=1：沙箱用例不许静默 skip）
        # 含 tests/test_doc_consistency.py：文档口径与实现的漂移门禁
        shell: bash
        run: |
          status=0
          # GitHub 的 bash 带 -e：写成 `cmd` + 下一行 `status=$?` 时，非零退出直接终止
          # 本步骤（红绿仍对，但后面的 cat 与落盘都不会执行）。|| 取回状态才拿得到它。
          python -m pytest -q -rfE --tb=short > pytest-output.txt 2>&1 || status=$?
          echo "$status" > pytest-status.txt
          cat pytest-output.txt
          exit $status
      - name: 失败清单写进 job summary
        # 本 job 在测试步骤之前还有 apt/ bubblewrap / 沙箱探活三道门槛，哪一步红都会
        # 在这里写明「没拿到 pytest 输出」，避免被误读成「测试挂了」。
        if: failure()
        run: python -X utf8 .github/scripts/ci_failure_summary.py pytest-output.txt
